# Full local stack: Postgres, Redis, Kafka (KRaft), MongoDB, an S3 mock,
# Prometheus, and the five services. `make up` then watch:
#   curl localhost:8080/v1/breaches?open=true
#   curl localhost:8080/v1/incidents/summary?by=commodity
#   open http://localhost:9091  (Prometheus)

x-service-env: &service-env
  DATABASE_URL: postgres://coldchain:coldchain@postgres:5432/coldchain?sslmode=disable
  REDIS_ADDR: redis:6379
  KAFKA_BROKERS: kafka:9092
  LOG_FORMAT: text

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coldchain
      POSTGRES_PASSWORD: coldchain
      POSTGRES_DB: coldchain
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldchain"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 12
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      retries: 30

  # Single-node replica set so majority write concern behaves as in prod.
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    healthcheck:
      # Initiates the replica set on first run; healthy once it is primary.
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongo:27017\"}]}) } quit(db.hello().isWritablePrimary ? 0 : 1)'"]
      interval: 3s
      retries: 30

  # S3-compatible mock standing in for Amazon S3 locally.
  s3:
    image: adobe/s3mock:4.4.0
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: coldchain-archive
    ports: ["9444:9090"]

  migrate:
    build: { context: ., args: { SERVICE: api } }
    image: coldchain/api:dev
    command: ["-migrate-only"]
    environment: *service-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  api:
    image: coldchain/api:dev
    environment:
      <<: *service-env
      # Local-only key; in AWS this comes from Secrets Manager.
      WEBHOOK_SECRET_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      WEBHOOK_ALLOW_INSECURE: "true"
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      mongo: { condition: service_healthy }

  ingest:
    build: { context: ., args: { SERVICE: ingest } }
    image: coldchain/ingest:dev
    environment: *service-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }

  incidents:
    build: { context: ., args: { SERVICE: incidents } }
    image: coldchain/incidents:dev
    environment:
      <<: *service-env
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
    depends_on:
      kafka: { condition: service_healthy }
      mongo: { condition: service_healthy }
      ingest: { condition: service_started }

  archiver:
    build: { context: ., args: { SERVICE: archiver } }
    image: coldchain/archiver:dev
    environment:
      <<: *service-env
      ARCHIVE_BUCKET: coldchain-archive
      ARCHIVE_FLUSH_EVERY: 30s
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_ENDPOINT_URL_S3: http://s3:9090
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      kafka: { condition: service_healthy }
      s3: { condition: service_started }

  simulator:
    build: { context: ., args: { SERVICE: simulator } }
    image: coldchain/simulator:dev
    environment:
      <<: *service-env
      API_BASE_URL: http://api:8080
      SIM_CONTAINERS: "2000"
      SIM_INTERVAL: 5s
    depends_on: [api, ingest]
    restart: on-failure

  prometheus:
    image: prom/prometheus:v3.3.0
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9091:9090"]
