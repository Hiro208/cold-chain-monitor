name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC federation to AWS; no long-lived keys in GitHub

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  CLUSTER: coldchain-prod

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production # requires reviewer approval in repo settings
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          for svc in api ingest archiver simulator; do
            docker buildx build --platform linux/arm64 --build-arg SERVICE=$svc \
              -t "$REGISTRY/coldchain/$svc:$TAG" --push .
          done

      - name: Deploy to EKS
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"
          cd deploy/k8s
          for svc in api ingest archiver; do
            kustomize edit set image "coldchain/$svc=$REGISTRY/coldchain/$svc:$TAG"
          done
          kubectl delete job coldchain-migrate -n coldchain --ignore-not-found
          kubectl apply -k .
          kubectl wait --for=condition=complete job/coldchain-migrate -n coldchain --timeout=5m
          kubectl rollout status deployment/coldchain-api -n coldchain --timeout=5m
          kubectl rollout status deployment/coldchain-ingest -n coldchain --timeout=5m
          kubectl rollout status deployment/coldchain-archiver -n coldchain --timeout=5m

      - name: Update alert Lambda
        run: |
          make lambda
          aws lambda update-function-code --function-name "$CLUSTER-breach-alert" \
            --zip-file fileb://lambda/breachalert/breachalert.zip --publish
