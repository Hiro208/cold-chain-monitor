global:
  scrape_interval: 5s

scrape_configs:
  - job_name: coldchain
    static_configs:
      - targets: ["api:9090", "ingest:9090", "archiver:9090"]

# Useful queries:
#   p99 breach detection latency (target < 2 s):
#     histogram_quantile(0.99, sum by (le) (rate(coldchain_ingest_breach_detection_latency_seconds_bucket[5m])))
#   ingest throughput:
#     rate(coldchain_ingest_readings_processed_total[1m])
