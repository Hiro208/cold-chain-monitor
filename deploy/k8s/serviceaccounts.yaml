# IRSA: each workload assumes its own least-privilege IAM role (see
# deploy/terraform/irsa.tf). Only the archiver may write to S3.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coldchain-api
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/coldchain-api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coldchain-ingest
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/coldchain-ingest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coldchain-archiver
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/coldchain-archiver
