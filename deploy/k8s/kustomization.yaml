apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: coldchain

resources:
  - namespace.yaml
  - config.yaml
  - serviceaccounts.yaml
  - migrate-job.yaml
  - api.yaml
  - ingest.yaml
  - archiver.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: cold-chain-monitor
    includeTemplates: true

# CI replaces these with the ECR repository and the commit SHA:
#   kustomize edit set image coldchain/api=<acct>.dkr.ecr.<region>.amazonaws.com/coldchain/api:<sha>
images:
  - name: coldchain/api
    newTag: latest
  - name: coldchain/ingest
    newTag: latest
  - name: coldchain/archiver
    newTag: latest
