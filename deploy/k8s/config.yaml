apiVersion: v1
kind: ConfigMap
metadata:
  name: coldchain-config
data:
  KAFKA_READINGS_TOPIC: reefer.readings.v1
  KAFKA_BREACHES_TOPIC: reefer.breaches.v1
  KAFKA_DLQ_TOPIC: reefer.readings.dlq.v1
  INGEST_BATCH_SIZE: "500"
  INGEST_BATCH_WAIT: 250ms
  BREACH_HYSTERESIS_C: "0.5"
  REDIS_STATE_TTL: 24h
  ARCHIVE_PREFIX: raw/readings
  ARCHIVE_FLUSH_EVERY: 1m
  LOG_FORMAT: json
---
# Populated by External Secrets Operator from AWS Secrets Manager
# (coldchain/<env>/runtime); never committed with real values. Expected keys:
#   DATABASE_URL, REDIS_ADDR, REDIS_PASSWORD, KAFKA_BROKERS,
#   WEBHOOK_SECRET_KEY, ARCHIVE_BUCKET
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: coldchain-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: coldchain-secrets
  dataFrom:
    - extract:
        key: coldchain/prod/runtime
